<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#6c5ce7">
  <link rel="manifest" href="manifest.json">
  <title>ChatLink</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #6c5ce7;
      --primary-dark: #5a4bd1;
      --bg: #f0f2f5;
      --surface: #fff;
      --text: #1a1a2e;
      --text-secondary: #666;
      --bubble-out: #6c5ce7;
      --bubble-out-text: #fff;
      --bubble-in: #fff;
      --bubble-in-text: #1a1a2e;
      --danger: #e74c3c;
      --radius: 16px;
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }
    .screen { display: none; flex-direction: column; height: 100%; }
    .screen.active { display: flex; }

    /* Join Screen */
    .join-screen {
      justify-content: center;
      align-items: center;
      padding: 24px;
      background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
    }
    .join-card {
      background: var(--surface);
      border-radius: 20px;
      padding: 36px 28px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 60px rgba(108,92,231,0.3);
      text-align: center;
    }
    .join-card h1 {
      font-size: 32px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }
    .join-card .subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }
    .relay-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 20px;
      font-size: 12px;
      color: #888;
    }
    .relay-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #ccc;
      flex-shrink: 0;
    }
    .relay-dot.ok { background: #4caf50; }
    .relay-dot.err { background: #e74c3c; }
    .relay-stats {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 16px;
      font-size: 11px;
      color: #999;
      flex-wrap: wrap;
    }
    .relay-stats span { white-space: nowrap; }
    .relay-stats .green { color: #4caf50; }
    .relay-stats .red { color: #e74c3c; }
    .join-card label {
      display: block;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .join-card input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 18px;
      text-align: center;
      letter-spacing: 6px;
      font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
      outline: none;
      transition: border-color 0.2s;
      text-transform: uppercase;
    }
    .join-card input:focus { border-color: var(--primary); }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 10px;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      margin-top: 16px;
    }
    .btn-outline {
      background: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
    }
    .divider {
      display: flex; align-items: center;
      margin: 20px 0; color: #aaa; font-size: 13px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: #e0e0e0;
    }
    .divider span { padding: 0 12px; }

    /* Chat Screen */
    .chat-header {
      background: var(--primary);
      color: #fff;
      padding: 12px 16px;
      padding-top: max(12px, env(safe-area-inset-top));
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .chat-header .room-badge {
      background: rgba(255,255,255,0.2);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
    }
    .chat-header .status {
      font-size: 12px;
      opacity: 0.9;
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #2ecc71;
    }
    .status-dot.disconnected { background: #e74c3c; }
    .status-dot.connecting { background: #f39c12; animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.4; } }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      -webkit-overflow-scrolling: touch;
    }
    .msg-row {
      display: flex;
      max-width: 85%;
    }
    .msg-row.in { align-self: flex-start; }
    .msg-row.out { align-self: flex-end; }
    .msg-bubble {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.4;
      word-break: break-word;
      position: relative;
    }
    .msg-row.in .msg-bubble {
      background: var(--bubble-in);
      color: var(--bubble-in-text);
      border-bottom-left-radius: 6px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .msg-row.out .msg-bubble {
      background: var(--bubble-out);
      color: var(--bubble-out-text);
      border-bottom-right-radius: 6px;
    }
    .msg-row.system {
      align-self: center;
      max-width: 100%;
    }
    .msg-row.system .msg-bubble {
      background: rgba(0,0,0,0.05);
      color: var(--text-secondary);
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 12px;
    }
    .msg-bubble img, .msg-bubble video {
      max-width: 240px;
      max-height: 320px;
      border-radius: 10px;
      display: block;
      cursor: pointer;
    }
    .msg-bubble .file-card {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0,0,0,0.05);
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
    }
    .msg-row.out .msg-bubble .file-card { background: rgba(255,255,255,0.15); }
    .file-card .file-icon { font-size: 28px; }
    .file-card .file-info { font-size: 13px; }
    .file-card .file-size { font-size: 11px; opacity: 0.7; }
    .progress-wrap {
      margin-top: 6px;
      background: rgba(0,0,0,0.1);
      border-radius: 6px;
      height: 6px;
      overflow: hidden;
    }
    .msg-row.out .progress-wrap { background: rgba(255,255,255,0.25); }
    .progress-bar {
      height: 100%;
      background: var(--primary);
      border-radius: 6px;
      transition: width 0.2s;
      width: 0%;
    }
    .progress-text {
      font-size: 11px;
      margin-top: 4px;
      opacity: 0.7;
    }
    .msg-time {
      font-size: 10px;
      opacity: 0.6;
      margin-top: 4px;
      padding: 0 4px;
    }
    .msg-row.out .msg-time { text-align: right; }

    .empty-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      gap: 12px;
    }
    .empty-chat .icon { font-size: 56px; opacity: 0.6; }

    /* Input bar */
    .input-bar {
      background: var(--surface);
      padding: 10px 12px;
      padding-bottom: calc(10px + var(--safe-bottom));
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
      box-shadow: 0 -1px 4px rgba(0,0,0,0.04);
    }
    .input-bar button {
      width: 40px; height: 40px;
      border: none; border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .btn-attach {
      background: #f0f0f0;
      color: var(--text-secondary);
    }
    .btn-send {
      background: var(--primary);
      color: #fff;
    }
    .btn-send:disabled {
      background: #ccc;
      cursor: default;
    }
    .input-bar textarea {
      flex: 1;
      border: none;
      background: #f0f0f0;
      border-radius: 20px;
      padding: 10px 16px;
      font-size: 15px;
      font-family: inherit;
      resize: none;
      outline: none;
      max-height: 100px;
      min-height: 40px;
      line-height: 1.4;
    }
    #fileInput { display: none; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .toast.show { opacity: 1; }
    .toast.success { background: #27ae60; }
    .toast.error { background: var(--danger); }

    /* File preview */
    .preview-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; z-index: 200; gap: 16px;
    }
    .preview-overlay img, .preview-overlay video {
      max-width: 90vw; max-height: 60vh; border-radius: 12px;
    }
    .preview-overlay .preview-name { color: #fff; font-size: 14px; }
    .preview-actions { display: flex; gap: 12px; }
    .preview-actions button {
      padding: 12px 28px; border: none; border-radius: 24px;
      font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .preview-cancel { background: rgba(255,255,255,0.2); color: #fff; }
    .preview-send { background: var(--primary); color: #fff; }
  </style>
</head>
<body>

<!-- Join Screen -->
<div class="screen active" id="joinScreen">
  <div class="join-card">
    <h1>ChatLink</h1>
    <p class="subtitle">输入房间号，即时连接</p>
    <label>房间号</label>
    <input type="text" id="roomInput" maxlength="6" placeholder="输入6位房间号" autocomplete="off">
    <div class="relay-status" id="relayStatus" onclick="probeRelays()">
      <span class="relay-dot" id="relayDot"></span>
      <span id="relayText">检测中继...</span>
    </div>
    <div class="relay-stats" id="relayStats"></div>
    <button class="btn btn-primary" onclick="joinRoom()">加入房间</button>
    <div class="divider"><span>或</span></div>
    <button class="btn btn-outline" onclick="createRoom()">创建新房间</button>
    <p style="font-size:11px;color:#aaa;margin-top:12px">数据点对点直传，不经过服务器</p>
  </div>
</div>

<!-- Chat Screen -->
<div class="screen" id="chatScreen">
  <div class="chat-header">
    <button style="background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:0" onclick="leaveRoom()">←</button>
    <span style="font-weight:700">ChatLink</span>
    <span class="room-badge" id="roomBadge" onclick="copyRoomCode()">------</span>
    <span class="status" id="statusBar">
      <span class="status-dot connecting" id="statusDot"></span>
      <span id="statusText">连接中...</span>
    </span>
  </div>
  <div class="messages" id="messages">
    <div class="empty-chat" id="emptyState">
      <span class="icon">💬</span>
      <span>等待对方加入...</span>
      <span style="font-size:13px">分享房间号给对方</span>
    </div>
  </div>
  <div class="input-bar">
    <button class="btn-attach" onclick="document.getElementById('fileInput').click()" title="发送文件">📎</button>
    <input type="file" id="fileInput" multiple accept="image/*,video/*" onchange="onFilesSelected(event)">
    <textarea id="msgInput" rows="1" placeholder="输入消息..." onkeydown="onInputKey(event)" oninput="autoResize(this)"></textarea>
    <button class="btn-send" id="sendBtn" onclick="sendText()" disabled>➤</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="preview-overlay" id="previewOverlay" style="display:none"></div>

<script>
// State
let ws = null;
let roomCode = '';
let isHost = false;
let connected = false;
let currentRelay = '';

// DOM
const $join = document.getElementById('joinScreen');
const $chat = document.getElementById('chatScreen');
const $messages = document.getElementById('messages');
const $empty = document.getElementById('emptyState');
const $msgInput = document.getElementById('msgInput');
const $sendBtn = document.getElementById('sendBtn');
const $roomBadge = document.getElementById('roomBadge');
const $statusDot = document.getElementById('statusDot');
const $statusText = document.getElementById('statusText');
const $toast = document.getElementById('toast');
const $preview = document.getElementById('previewOverlay');
const $fileInput = document.getElementById('fileInput');
const $roomInput = document.getElementById('roomInput');

let toastTimer = null;
let pendingFiles = [];
let incomingFiles = {};
const CHUNK_SIZE = 16 * 1024;

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  if (name === 'join') $join.classList.add('active');
  else $chat.classList.add('active');
}

function setStatus(s, txt) {
  $statusDot.className = 'status-dot ' + s;
  $statusText.textContent = txt;
}

function showToast(msg, type) {
  clearTimeout(toastTimer);
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || '') + ' show';
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

function copyRoomCode() {
  navigator.clipboard.writeText(roomCode).then(() => showToast('房间号已复制', 'success'));
}

function addMessage(type, content, extra) {
  $empty.style.display = 'none';
  const row = document.createElement('div');
  row.className = 'msg-row ' + type;

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';

  const hasFile = extra && extra.fileType;

  if (hasFile && extra.fileType.startsWith('image/') && !extra.progress) {
    const img = document.createElement('img');
    img.src = content;
    img.onclick = () => openPreview(content, 'image');
    bubble.appendChild(img);
  } else if (hasFile && extra.fileType.startsWith('video/') && !extra.progress) {
    const vid = document.createElement('video');
    vid.src = content;
    vid.controls = true;
    vid.playsInline = true;
    vid.onclick = (e) => { e.stopPropagation(); vid.play(); };
    bubble.appendChild(vid);
  } else if (hasFile && extra.fileType === 'file' && !extra.progress) {
    const card = document.createElement('div');
    card.className = 'file-card';
    card.onclick = () => { const a = document.createElement('a'); a.href = content; a.download = extra.fileName; a.click(); };
    const icon = document.createElement('span');
    icon.className = 'file-icon';
    icon.textContent = '📄';
    card.appendChild(icon);
    const info = document.createElement('div');
    info.className = 'file-info';
    info.innerHTML = `<strong>${extra.fileName}</strong><br><span class="file-size">${extra.fileSize}</span>`;
    card.appendChild(info);
    bubble.appendChild(card);
  } else if (hasFile && extra.fileId) {
    bubble.innerHTML = `<div style="font-size:14px">${extra.fileType.startsWith('image/') ? '🖼' : extra.fileType.startsWith('video/') ? '🎬' : '📄'} ${extra.fileName}</div>
      <div class="file-size" style="margin-top:2px">${extra.fileSize}</div>
      <div class="progress-wrap"><div class="progress-bar" id="progress-bar-${extra.fileId}"></div></div>
      <div class="progress-text" id="progress-text-${extra.fileId}">0%</div>`;
  } else {
    bubble.textContent = content;
  }

  const time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  row.appendChild(bubble);
  row.appendChild(time);
  $messages.appendChild(row);
  $messages.scrollTop = $messages.scrollHeight;
  return row;
}

function addSystem(msg) {
  addMessage('system', msg);
}

function openPreview(src, _type) {
  $preview.style.display = 'flex';
  $preview.innerHTML = `
    <img src="${src}" style="max-width:90vw;max-height:70vh;border-radius:12px">
    <div class="preview-actions">
      <button class="preview-cancel" onclick="closePreview()">关闭</button>
    </div>`;
}

function closePreview() {
  $preview.style.display = 'none';
  $preview.innerHTML = '';
  pendingFiles = [];
}

function sendPreviewFile() {
  const file = pendingFiles[0];
  if (file) sendFile(file);
  closePreview();
}

const RELAY_LIST = [
  { url: 'ws://124.221.100.11:8080/ws', name: '自建' }
];

function connectRelay(tryIndex) {
  const idx = tryIndex || 0;
  const relay = RELAY_LIST[idx];
  addSystem('连接中转 ' + (idx + 1) + '/' + RELAY_LIST.length + ' (' + relay.name + ')');
  const t0 = performance.now();
  ws = new WebSocket(relay.url);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    console.log('[WS] 已连接');
    recordRelay(relay.name, true, Math.round(performance.now() - t0));
    currentRelay = relay.name;
    setStatus('connecting', '已连接 ' + relay.name);
    ws.send(JSON.stringify({ type: 'room-join', room: roomCode }));
  };

  ws.onmessage = async (e) => {
    let data = e.data;
    if (data instanceof Blob) data = await data.arrayBuffer();
    if (data instanceof ArrayBuffer) {
      handleBinaryChunk(data);
    } else if (typeof data === 'string') {
      try {
        const msg = JSON.parse(data);
        handleWSMessage(msg);
      } catch {
        addMessage('in', data);
      }
    }
  };

  connected = false;
  let tried = tryIndex || 0;

  ws.onclose = () => {
    console.log('[WS] 断开');
    ws = null;
    if (!connected && tried < RELAY_LIST.length - 1) {
      recordRelay(relay.name, false);
      connectRelay(tried + 1);
      return;
    }
    if (!connected) recordRelay(relay.name, false);
    if (roomCode) addSystem('与服务器断开连接');
    setStatus('disconnected', connected ? '断开' : '错误');
  };

  ws.onerror = () => {
    // onclose will handle retry
  };
}

function handleWSMessage(msg) {
  switch (msg.type) {
    case 'room-joined':
      addSystem(isHost ? '房间已创建，等待对方...' : '已加入房间，等待对方...');
      break;
    case 'room-full':
      addSystem('房间已满');
      setStatus('disconnected', '满员');
      break;
    case 'peer-joined':
      connected = true;
      addSystem('对方已加入！可以开始聊天了');
      setStatus('connected', '已连接 - ' + (currentRelay || ''));
      break;
    case 'peer-left':
      addSystem('对方已离开');
      setStatus('disconnected', '对方离开');
      break;
    case 'text':
      addMessage('in', msg.content);
      break;
    case 'file-start':
      addSystem('收到文件: ' + msg.fileName + ' ' + formatSize(msg.fileSize) + ' (' + msg.totalChunks + '片)');
      incomingFiles[msg.fileId] = {
        chunks: new Array(msg.totalChunks),
        received: 0,
        total: msg.totalChunks,
        fileName: msg.fileName,
        fileType: msg.fileType,
        fileSize: msg.fileSize
      };
      break;
    case 'file-end':
      const f = incomingFiles[msg.fileId];
      if (f) {
        addSystem('文件接收完成，正在组装...');
        const merged = new Uint8Array(f.fileSize);
        let offset = 0;
        for (let i = 0; i < f.chunks.length; i++) {
          const chunk = new Uint8Array(f.chunks[i]);
          merged.set(chunk, offset);
          offset += chunk.byteLength;
        }
        const blob = new Blob([merged], { type: f.fileType });
        const url = URL.createObjectURL(blob);
        updateFileMessage(msg.fileId, url, f);
        delete incomingFiles[msg.fileId];
        addSystem('文件已就绪');
      }
      break;
  }
}

function handleBinaryChunk(data) {
  if (!(data instanceof ArrayBuffer)) {
    addSystem('收到非二进制数据: ' + typeof data);
    return;
  }
  const header = new Uint8Array(data.slice(0, 16));
  const fileId = new TextDecoder().decode(header.slice(0, 12)).trimEnd();
  const index = (header[12] << 24) | (header[13] << 16) | (header[14] << 8) | header[15];
  const chunkData = data.slice(16);
  const f = incomingFiles[fileId];
  if (f) {
    f.chunks[index] = chunkData;
    f.received++;
    const pct = Math.round((f.received / f.total) * 100);
    if (f.received === 1) {
      addMessage('in', '', {
        fileType: f.fileType,
        fileName: f.fileName,
        fileSize: formatSize(f.fileSize),
        fileId
      });
    }
    updateProgress(fileId, pct);
  }
}

async function createRoom() {
  const input = $roomInput.value.trim().toUpperCase();
  if (input.length !== 6 || !/^[A-Z0-9]+$/.test(input)) {
    showToast('请输入6位房间号', 'error');
    return;
  }
  roomCode = input;
  isHost = true;
  showScreen('chat');
  $roomBadge.textContent = roomCode;
  setStatus('connecting', '连接服务器...');
  connectRelay(relayReady ? relayReadyIndex : 0);
}

async function joinRoom() {
  const input = $roomInput.value.trim().toUpperCase();
  if (input.length !== 6 || !/^[A-Z0-9]+$/.test(input)) {
    showToast('请输入6位房间号', 'error');
    return;
  }
  roomCode = input;
  isHost = false;
  $roomBadge.textContent = roomCode;
  showScreen('chat');
  setStatus('connecting', '连接服务器...');
  connectRelay(relayReady ? relayReadyIndex : 0);
}

function send(data) {
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    showToast('未连接', 'error');
    return;
  }
  ws.send(data);
}

function sendText() {
  const text = $msgInput.value.trim();
  if (!text) return;
  send(JSON.stringify({ type: 'text', content: text }));
  addMessage('out', text);
  $msgInput.value = '';
  $sendBtn.disabled = true;
  $msgInput.style.height = 'auto';
}

function sendFile(file) {
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    showToast('未连接', 'error');
    return;
  }
  const fileId = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
  const fileType = file.type.startsWith('image/') ? file.type :
                   file.type.startsWith('video/') ? file.type : 'file';

  send(JSON.stringify({
    type: 'file-start',
    fileId, fileName: file.name, fileType, fileSize: file.size, totalChunks
  }));

  addMessage('out', '', {
    fileType, fileName: file.name, fileSize: formatSize(file.size), fileId
  });
  addSystem('开始发送: ' + file.name + ' (' + totalChunks + '片)');

  const reader = file.stream().getReader();
  let chunkIndex = 0;
  let sent = 0;

  function pump() {
    reader.read().then(({ done, value }) => {
      if (done) {
        send(JSON.stringify({ type: 'file-end', fileId }));
        return;
      }
      let offset = 0;
      while (offset < value.byteLength) {
        const raw = value.slice(offset, offset + CHUNK_SIZE);
        offset += CHUNK_SIZE;
        const header = buildChunkHeader(fileId, chunkIndex);
        const packet = new Uint8Array(header.byteLength + raw.byteLength);
        packet.set(new Uint8Array(header), 0);
        packet.set(new Uint8Array(raw), header.byteLength);
        ws.send(packet.buffer);
        chunkIndex++;
        sent += raw.byteLength;
        updateProgress(fileId, Math.round((sent / file.size) * 100));
      }
      pump();
    });
  }
  pump();
}

function buildChunkHeader(fileId, index) {
  const idBytes = new TextEncoder().encode(fileId.padEnd(12, ' '));
  const header = new Uint8Array(16);
  header.set(idBytes, 0);
  header[12] = (index >>> 24) & 0xff;
  header[13] = (index >>> 16) & 0xff;
  header[14] = (index >>> 8) & 0xff;
  header[15] = index & 0xff;
  return header.buffer;
}

function updateProgress(fileId, pct) {
  const bar = document.getElementById('progress-bar-' + fileId);
  const txt = document.getElementById('progress-text-' + fileId);
  if (bar) bar.style.width = pct + '%';
  if (txt) txt.textContent = pct + '%';
}

function updateFileMessage(fileId, url, f) {
  const bar = document.getElementById('progress-bar-' + fileId);
  if (!bar) {
    addSystem('进度条元素未找到，重新渲染');
    addMessage('in', url, {
      fileType: f.fileType.startsWith('image/') ? f.fileType :
                f.fileType.startsWith('video/') ? f.fileType : 'file',
      fileName: f.fileName,
      fileSize: formatSize(f.fileSize)
    });
    return;
  }
  const bubble = bar.closest('.msg-bubble');
  if (!bubble) {
    addSystem('气泡元素未找到');
    return;
  }
  bubble.innerHTML = '';
  if (f.fileType.startsWith('image/')) {
    const img = document.createElement('img');
    img.src = url;
    img.onclick = () => openPreview(url, 'image');
    img.onerror = () => { bubble.textContent = '图片加载失败'; };
    bubble.appendChild(img);
  } else if (f.fileType.startsWith('video/')) {
    const vid = document.createElement('video');
    vid.src = url;
    vid.controls = true;
    vid.playsInline = true;
    bubble.appendChild(vid);
  } else {
    const card = document.createElement('div');
    card.className = 'file-card';
    card.onclick = () => { const a = document.createElement('a'); a.href = url; a.download = f.fileName; a.click(); };
    card.innerHTML = '<span class="file-icon">📄</span><div class="file-info"><strong>' + f.fileName + '</strong><br><span class="file-size">' + formatSize(f.fileSize) + '</span></div>';
    bubble.appendChild(card);
  }
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function onFilesSelected(e) {
  const files = Array.from(e.target.files);
  if (files.length === 0) return;

  const file = files[0];
  pendingFiles = [file];
  $preview.style.display = 'flex';

  if (file.type.startsWith('image/')) {
    const reader = new FileReader();
    reader.onload = () => {
      $preview.innerHTML = `
        <img src="${reader.result}" style="max-width:90vw;max-height:60vh;border-radius:12px">
        <div class="preview-name">${file.name} (${formatSize(file.size)})</div>
        <div class="preview-actions">
          <button class="preview-cancel" onclick="closePreview()">取消</button>
          <button class="preview-send" onclick="sendPreviewFile()">发送</button>
        </div>`;
    };
    reader.readAsDataURL(file);
  } else if (file.type.startsWith('video/')) {
    const url = URL.createObjectURL(file);
    $preview.innerHTML = `
      <video src="${url}" controls playsinline style="max-width:90vw;max-height:50vh;border-radius:12px"></video>
      <div class="preview-name">${file.name} (${formatSize(file.size)})</div>
      <div class="preview-actions">
        <button class="preview-cancel" onclick="closePreview()">取消</button>
        <button class="preview-send" onclick="sendPreviewFile()">发送</button>
      </div>`;
  } else {
    $preview.innerHTML = `
      <div style="color:#fff;font-size:48px">📄</div>
      <div class="preview-name">${file.name} (${formatSize(file.size)})</div>
      <div class="preview-actions">
        <button class="preview-cancel" onclick="closePreview()">取消</button>
        <button class="preview-send" onclick="sendPreviewFile()">发送</button>
      </div>`;
  }
  $fileInput.value = '';
}

function onInputKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendText();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
  $sendBtn.disabled = el.value.trim() === '';
}

function leaveRoom() {
  if (ws) { ws.close(); ws = null; }
  roomCode = '';
  isHost = false;
  $messages.innerHTML = '<div class="empty-chat" id="emptyState"><span class="icon">💬</span><span>等待对方加入...</span><span style="font-size:13px">分享房间号给对方</span></div>';
  showScreen('join');
}

let relayReady = false;
let relayReadyIndex = -1;

const STATS_KEY = 'chatlink_relay_stats';
function loadStats() {
  try { return JSON.parse(localStorage.getItem(STATS_KEY)) || {}; }
  catch { return {}; }
}
function saveStats(s) { try { localStorage.setItem(STATS_KEY, JSON.stringify(s)); } catch {} }

function recordRelay(name, ok, ms) {
  const s = loadStats();
  const r = s[name] || { ok: 0, fail: 0, totalMs: 0, count: 0 };
  if (ok) { r.ok++; } else { r.fail++; }
  if (ms != null) { r.totalMs += ms; r.count++; }
  s[name] = r;
  saveStats(s);
  renderStats(s);
}

function relayLine(name, r) {
  const total = r.ok + r.fail;
  if (!total) return '<span>' + name + ' 无记录</span>';
  const pct = Math.round(r.ok / total * 100);
  const cls = pct >= 80 ? 'green' : pct >= 50 ? '' : 'red';
  let line = '<span class="' + cls + '">' + name + ' ';
  if (r.count) line += Math.round(r.totalMs / r.count) + 'ms ';
  line += r.ok + '/' + total + ' (' + pct + '%)</span>';
  return line;
}

function renderStats(s) {
  s = s || loadStats();
  let html = RELAY_LIST.map(r => relayLine(r.name, s[r.name] || { ok: 0, fail: 0 })).join('');
  $relayStats.innerHTML = html;
}

async function probeRelay(idx) {
  if (idx >= RELAY_LIST.length) {
    $relayDot.className = 'relay-dot err';
    $relayText.textContent = '无可用中继';
    return;
  }
  const relay = RELAY_LIST[idx];
  $relayText.textContent = '检测 ' + relay.name + '...';
  const t0 = performance.now();
  const ws = new WebSocket(relay.url);
  return new Promise((resolve) => {
    const done = (ok) => {
      const ms = ok ? Math.round(performance.now() - t0) : null;
      recordRelay(relay.name, ok, ms);
      ws.close();
      if (ok) {
        $relayDot.className = 'relay-dot ok';
        $relayText.textContent = relay.name + ' 可用' + (ms ? ' (' + ms + 'ms)' : '');
        relayReady = true;
        relayReadyIndex = idx;
        resolve();
      } else {
        probeRelay(idx + 1).then(resolve);
      }
    };
    ws.onopen = () => done(true);
    ws.onerror = () => done(false);
    setTimeout(() => done(false), 3000);
  });
}

function probeRelays() {
  relayReady = false;
  relayReadyIndex = -1;
  $relayDot.className = 'relay-dot';
  $relayText.textContent = '检测中继...';
  renderStats(loadStats());
  probeRelay(0);
}

const $relayDot = document.getElementById('relayDot');
const $relayText = document.getElementById('relayText');
const $relayStats = document.getElementById('relayStats');
probeRelays();

window.addEventListener('beforeunload', () => {
  if (ws) { ws.close(); ws = null; }
});

// Register service worker for PWA
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data === 'reload') location.reload();
  });
}
</script>
